<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memorizar hiragana y katakana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=Klee+One:wght@400;600&display=swap">
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#1f1b16;--mut:#6b6358;--line:#e3d9c6;--acc:#b3261e;--ok:#1d7a3a;--okbg:#e0f2e6;--badbg:#f6e3df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#211d17;--ink:#f1ebe0;--mut:#a79f90;--line:#3a3329;--acc:#ef7b72;--ok:#6fd08c;--okbg:#1f3526;--badbg:#3a2220}}
:root[data-theme="dark"]{--bg:#17140f;--card:#211d17;--ink:#f1ebe0;--mut:#a79f90;--line:#3a3329;--acc:#ef7b72;--ok:#6fd08c;--okbg:#1f3526;--badbg:#3a2220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 14px 48px}
h1{font:600 24px/1.2 "Noto Serif JP",serif;margin:0 0 12px}
h2{font-size:17px;margin:26px 0 8px}
button,input{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px}
.c .g{font-size:clamp(22px,6.5vw,34px)}
.c small{font-size:12px;color:var(--mut);min-height:15px}
.c.e{visibility:hidden}
.hide .c small{visibility:hidden}
.hide .c.rev small{visibility:visible}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.big{font-size:min(30vw,140px);line-height:1.15}
input{width:140px;text-align:center;font-size:20px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.fb{min-height:28px;margin-top:8px;font-weight:600}
.q.ok{background:var(--okbg)}.q.bad{background:var(--badbg)}
.st{color:var(--mut);font-size:14px;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>ひらがな · カタカナ</h1>

<div class="bar" id="fonts">
<button data-f="'Noto Serif JP',serif" class="on">Mincho</button>
<button data-f="'Noto Sans JP',sans-serif">Gothic</button>
<button data-f="'Klee One','Noto Sans JP',sans-serif">Libro de texto</button>
<button id="hid">Ocultar romaji</button>
</div>
<p class="st" style="margin:0 0 8px">Cada casilla: hiragana arriba, katakana abajo. Con el romaji oculto, tocá una casilla para verlo.</p>

<div class="grid" id="tbl"></div>

<h2>Práctica</h2>
<div class="bar" id="ps"><button data-s="h" class="on">Hiragana</button><button data-s="k">Katakana</button><button data-s="m">Ambos</button></div>
<div class="q" id="q">
<div class="big" id="kana">?</div>
<input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="romaji">
<div class="bar" style="justify-content:center"><button id="go" class="on">Comprobar</button></div>
<div class="fb" id="fb"></div>
<div class="st" id="st"></div>
</div>
</main>
<script>
var R="あアa いイi うウu えエe おオo|かカka きキki くクku けケke こコko|さサsa しシshi すスsu せセse そソso|たタta ちチchi つツtsu てテte とトto|なナna にニni ぬヌnu ねネne のノno|はハha ひヒhi ふフfu へヘhe ほホho|まマma みミmi むムmu めメme もモmo|やヤya - ゆユyu - よヨyo|らラra りリri るルru れレre ろロro|わワwa - - - をヲwo|んンn - - - -";
var rows=R.split("|").map(function(r){return r.split(" ")}),items=[],font="'Noto Serif JP',serif",html="";
rows.forEach(function(r){r.forEach(function(t){if(t=="-"){html+="<div class='c e'></div>";return}
var m=t.match(/^(.)(.)([a-z]+)$/);items.push({h:m[1],k:m[2],r:m[3],w:1});
html+="<button class='c' data-r='"+m[3]+"'><span class='g'>"+m[1]+"</span><span class='g'>"+m[2]+"</span><small>"+m[3]+"</small></button>"})});
var T=document.getElementById("tbl");T.innerHTML=html;
T.onclick=function(e){var b=e.target.closest(".c");if(b)b.classList.toggle("rev")};
function setFont(){document.querySelectorAll(".g,.big").forEach(function(n){n.style.fontFamily=font})}
document.getElementById("fonts").onclick=function(e){var b=e.target.closest("button");if(!b)return;
if(b.id=="hid"){b.classList.toggle("on");T.classList.toggle("hide");T.querySelectorAll(".rev").forEach(function(x){x.classList.remove("rev")});return}
this.querySelectorAll("button[data-f]").forEach(function(x){x.classList.toggle("on",x==b)});font=b.dataset.f;setFont()};
var mode="h",cur=null,done=false,ok=0,tot=0,streak=0;
var ALT={shi:["si"],chi:["ti"],tsu:["tu"],fu:["hu"]};
function pick(){var sum=0;items.forEach(function(i){sum+=i.w});var x=Math.random()*sum,c=items[0];
for(var i=0;i<items.length;i++){x-=items[i].w;if(x<=0){c=items[i];break}}return c}
function nxt(){cur=pick();var s=mode=="m"?(Math.random()<.5?"h":"k"):mode;
document.getElementById("kana").textContent=s=="h"?cur.h:cur.k;
document.getElementById("q").className="q";document.getElementById("fb").textContent="";
var i=document.getElementById("inp");i.value="";i.focus({preventScroll:true});done=false;setFont()}
function check(){if(done){nxt();return}
var v=document.getElementById("inp").value.trim().toLowerCase();if(!v)return;
var good=v==cur.r||(ALT[cur.r]||[]).indexOf(v)>-1;tot++;
var q=document.getElementById("q"),fb=document.getElementById("fb");
if(good){ok++;streak++;cur.w=Math.max(.3,cur.w*.6);q.className="q ok";fb.textContent="Correcto: "+cur.r}
else{streak=0;cur.w=Math.min(8,cur.w*2.2);q.className="q bad";fb.textContent="Era: "+cur.h+" "+cur.k+" = "+cur.r}
document.getElementById("st").textContent="Aciertos: "+ok+" de "+tot+" · Racha: "+streak+" · Las que fallás aparecen más seguido";
done=true;document.getElementById("go").textContent="Siguiente"}
document.getElementById("go").onclick=function(){var was=done;check();if(was)this.textContent="Comprobar"};
document.getElementById("inp").onkeydown=function(e){if(e.key=="Enter"){var was=done;check();if(was)document.getElementById("go").textContent="Comprobar"}};
document.getElementById("ps").onclick=function(e){var b=e.target.closest("button");if(!b)return;
this.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x==b)});mode=b.dataset.s;document.getElementById("go").textContent="Comprobar";nxt()};
setFont();nxt();
</script>
</body>
</html>
